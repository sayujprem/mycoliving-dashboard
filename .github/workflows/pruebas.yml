# Corre la suite completa en cada push y en cada pull request.
#
# Las pruebas de aislamiento entre cuentas (tests/test_aislamiento.py) son la razon
# principal: un cambio que abra una fuga entre usuarios tiene que ponerse en rojo antes
# de llegar a produccion. Gratis en repositorios publicos.

name: Pruebas

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        # Misma version mayor que Supabase.
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mycoliving_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/mycoliving_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - run: python -m pytest -q
